name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure SSH for submodule
        env:
          SSH_KEY: ${{ secrets.OPENFREQAUDIO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/openfreqaudio_key
          chmod 600 ~/.ssh/openfreqaudio_key
          printf 'Host github.com\n  IdentityFile ~/.ssh/openfreqaudio_key\n  StrictHostKeyChecking no\n' >> ~/.ssh/config

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test OpenFreq.sln --no-restore

  build-server:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure SSH for submodule
        env:
          SSH_KEY: ${{ secrets.OPENFREQAUDIO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/openfreqaudio_key
          chmod 600 ~/.ssh/openfreqaudio_key
          printf 'Host github.com\n  IdentityFile ~/.ssh/openfreqaudio_key\n  StrictHostKeyChecking no\n' >> ~/.ssh/config

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish all targets
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          # Portable (self-contained) only -- no .NET runtime required on the target machine.
          # The framework-dependent flavor is intentionally no longer built or published.
          for RID in win-x64 linux-x64; do
            OUTDIR="publish/OpenFreq-Server-${RID}-portable"
            dotnet publish OpenFreq.Server/OpenFreq.Server.csproj \
              -c Release -r "$RID" --self-contained true \
              -p:PublishSingleFile=true -p:PublishTrimmed=true \
              -p:DebugType=none -p:DebugSymbols=false \
              -p:InformationalVersion="$VERSION" \
              -o "$OUTDIR"
            pushd "$OUTDIR"
            zip -r "$GITHUB_WORKSPACE/OpenFreq-Server-${{ github.ref_name }}-${RID}-portable.zip" . --exclude "*.pdb"
            popd
          done

      - uses: actions/upload-artifact@v4
        with:
          name: server-builds
          path: OpenFreq-Server-*.zip
          retention-days: 1

  build-client:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure SSH for submodule
        env:
          SSH_KEY: ${{ secrets.OPENFREQAUDIO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/openfreqaudio_key
          chmod 600 ~/.ssh/openfreqaudio_key
          printf 'Host github.com\n  IdentityFile ~/.ssh/openfreqaudio_key\n  StrictHostKeyChecking no\n' >> ~/.ssh/config

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish all targets
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          # Portable (self-contained) only -- no .NET runtime required on the target machine.
          # The framework-dependent flavor is intentionally no longer built or published.
          for RID in win-x64 linux-x64; do
            OUTDIR="publish/OpenFreq-Client-${RID}-portable"
            dotnet publish OpenFreq.Client/OpenFreq.Client.csproj \
              -c Release -r "$RID" --self-contained true \
              -p:PublishSingleFile=true -p:PublishTrimmed=true -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true \
              -p:DebugType=none -p:DebugSymbols=false \
              -p:InformationalVersion="$VERSION" \
              -o "$OUTDIR"
            if [[ "$RID" == "win-x64" ]]; then
              cp libs/OpenFreqAudio/OpenFreqAudio/Assets/windows/*.dll "$OUTDIR/"
            else
              cp libs/OpenFreqAudio/OpenFreqAudio/Assets/linux/*.so "$OUTDIR/"
            fi
            pushd "$OUTDIR"
            zip -r "$GITHUB_WORKSPACE/OpenFreq-Client-${{ github.ref_name }}-${RID}-portable.zip" . --exclude "*.pdb"
            popd
          done

      - uses: actions/upload-artifact@v4
        with:
          name: client-builds
          path: OpenFreq-Client-*.zip
          retention-days: 1

  build-installer:
    needs: [build-client]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Compute version
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: client-builds
          path: artifacts-download

      - name: Extract portable client build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "artifacts\publish\client\win-x64" -Force | Out-Null
          Expand-Archive -Path "artifacts-download\OpenFreq-Client-${{ github.ref_name }}-win-x64-portable.zip" `
            -DestinationPath "artifacts\publish\client\win-x64" -Force

      - name: Build installer
        shell: pwsh
        run: |
          # GitHub-hosted windows-latest runners ship Inno Setup 6 preinstalled.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" "installer\windows\OpenFreqDcsClient.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: installer-builds
          path: artifacts/installers/*.exe
          retention-days: 1

  docker:
    needs: [test, build-server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure SSH for submodule
        env:
          SSH_KEY: ${{ secrets.OPENFREQAUDIO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/openfreqaudio_key
          chmod 600 ~/.ssh/openfreqaudio_key
          printf 'Host github.com\n  IdentityFile ~/.ssh/openfreqaudio_key\n  StrictHostKeyChecking no\n' >> ~/.ssh/config

      - name: Fetch submodules
        run: git submodule update --init --recursive

      # Image names must be lowercase; the org is "UOAF"
      - name: Compute image name and version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openfreq-server" >> "$GITHUB_ENV"
          VERSION="${{ github.ref_name }}"
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: OpenFreq.Server/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [build-server, build-client, build-installer]
    runs-on: ubuntu-latest
    steps:
      - name: Compute bare version
        run: |
          VERSION="${{ github.ref_name }}"
          echo "BARE_VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-builds'
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenFreq ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## 🛠 Windows Installer

            Detects your DCS Saved Games folder(s) automatically, installs/repairs the radio export,
            and cleans up on uninstall. Recommended for Windows.

            [Download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/OpenFreq-DCS-Client-${{ env.BARE_VERSION }}-win-x64.exe)

            ## 📦 Downloads

            Portable/self-contained -- no .NET install needed, unzip and run.

            |  | 🪟 Windows | 🐧 Linux |
            |---|---|---|
            | **Client** | [Download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/OpenFreq-Client-${{ github.ref_name }}-win-x64-portable.zip) | [Download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/OpenFreq-Client-${{ github.ref_name }}-linux-x64-portable.zip) |
            | **Server** | [Download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/OpenFreq-Server-${{ github.ref_name }}-win-x64-portable.zip) | [Download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/OpenFreq-Server-${{ github.ref_name }}-linux-x64-portable.zip) |
          files: |
            artifacts/*.zip
            artifacts/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
